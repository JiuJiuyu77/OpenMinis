name: Runner probe
on:
  workflow_dispatch:

jobs:
  labels:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel, macos-14-large, macos-13, macos-15-arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          uname -m
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
