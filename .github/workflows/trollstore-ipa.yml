name: TrollStore TIPA

# 出 TrollStore 可直装的 .tipa（adhoc 签名 + 原生编译所需权限）
# 触发：手动 / push tag
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (macos-15 has Xcode 26.x + iOS 26.2 SDK and a shorter queue)"
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      xcode_version:
        description: "Xcode version to select on the runner (must exist there)"
        type: string
        default: "26.3"
  push:
    tags: ["v*"]

# [T-ci-queue] 不要用 cancel-in-progress 互相取消：macos-26 分配慢时，
# 一次重跑会把还在排队的旧任务取消，看起来像“构建一直失败/一直在列队”。
# 这里只做串行化，让排在后面的任务安静等待，由人决定是否手动取消。
concurrency:
  group: trollstore-tipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-15-arm64 ships Xcode 26.2/26.3 (iOS 26.2 SDK) and is far less
    # contended than macos-26, where a 30-minute build could sit queued for
    # hours. Both images work; the runner is selectable per dispatch.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          WANTED="${{ inputs.xcode_version || '26.3' }}"
          for cand in "/Applications/Xcode_${WANTED}.app" "/Applications/Xcode_${WANTED}.0.app"; do
            if [ -d "$cand" ]; then
              sudo xcode-select -s "$cand/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare configs
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties || true

      - name: Setup Go (rclone needs the toolchain pinned by go.mod)
        uses: actions/setup-go@v5
        with:
          # deps/rclone-mobile/go.mod declares go 1.25.5. Newer toolchains break
          # go-json-experiment/json (undefined json.SkipFunc / DiscardUnknownMembers).
          go-version: '1.25.x'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Cache LAME
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/lame-3.100
          key: lame-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh') }}
          restore-keys: lame-${{ runner.os }}-

      - name: Cache FFmpeg frameworks
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks
            deps/ffmpeg-6.1.2
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('deps/build_ffmpeg.sh', 'deps/ffmpeg-patch/**') }}
          restore-keys: ffmpeg-${{ runner.os }}-

      - name: Cache iSH + Alpine rootfs
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/.cache
            deps/ish/build-ios
            deps/ish/build-native
          key: ish-${{ runner.os }}-${{ hashFiles('deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh') }}
          restore-keys: ish-${{ runner.os }}-

      - name: Cache rclone xcframework
        uses: actions/cache@v4
        with:
          path: |
            deps/build/rclone
            deps/frameworks/Rclone.xcframework
          key: rclone-${{ runner.os }}-${{ hashFiles('deps/build_rclone_ios.sh', 'deps/rclone-mobile/go.mod', 'deps/rclone-mobile/go.sum') }}
          restore-keys: rclone-${{ runner.os }}-

      - name: Build native deps
        run: |
          set -euo pipefail
          brew install nasm yasm pkg-config cmake automake libtool texi2html meson ninja llvm lld libarchive || true
          # libarchive is keg-only ("provided_by_macos") so Homebrew does not link
          # it into /opt/homebrew; prepare_alpine_rootfs.sh needs libarchive to
          # build the host-side fakefsify tool. Point the compilers at the keg.
          export CPPFLAGS="-I/opt/homebrew/opt/libarchive/include ${CPPFLAGS:-}"
          export LDFLAGS="-L/opt/homebrew/opt/libarchive/lib ${LDFLAGS:-}"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/libarchive/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ls /opt/homebrew/opt/libarchive/lib/libarchive.dylib
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          which clang && clang --version | head -1
          # iSH's arm64 VDSO target hardcodes `-fuse-ld=lld` for an
          # aarch64-linux-gnu ELF link; Homebrew's llvm keg does not ship
          # ld.lld, so the separate `lld` formula must be on PATH or clang
          # reports "invalid linker name in argument '-fuse-ld=lld'".
          which ld.lld && ld.lld --version | head -1
          python3 -m pip install --user --break-system-packages meson ninja || pip3 install --user meson ninja || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          which meson || python3 -m mesonbuild.mesonmain --version || true
          chmod +x deps/*.sh
          [ -f deps/lame-build/lib/libmp3lame.a ] || ./deps/build_lame.sh
          [ -d deps/frameworks/FFmpeg.xcframework ] || ./deps/build_ffmpeg.sh
          [ -f deps/libs/libish.a ] || ./deps/build_ish.sh
          [ -f deps/resources/alpine-rootfs.zip ] || ./deps/prepare_alpine_rootfs.sh
          [ -d deps/frameworks/Rclone.xcframework ] || ./deps/build_rclone_ios.sh
          ls -la deps/frameworks | head -20

      - name: Install ldid
        run: |
          brew install ldid || true
          which ldid && ldid -h | head -3 || echo "ldid missing"

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cd src/ios
          xcodebuild \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Minis.app"
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Sign + package tipa
        run: |
          set -euo pipefail
          APP="$APP"
          ENT="$GITHUB_WORKSPACE/Configs/TrollStore.entitlements"

          # 主二进制 + 所有 Mach-O（含 dylib / appex / framework 里的可执行文件）
          find "$APP" -type f -perm -111 | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              ldid -S"$ENT" "$f" || ldid -S "$f"
            fi
          done
          ldid -S"$ENT" "$APP/Minis" || true

          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$APP" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qry "$GITHUB_WORKSPACE/Minis-NativeBuild.tipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -la Minis-NativeBuild.tipa
          shasum -a 256 Minis-NativeBuild.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: Minis-NativeBuild-tipa
          path: Minis-NativeBuild.tipa
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### TrollStore TIPA"
            echo "- runner: \`${{ inputs.runner || 'macos-15' }}\`"
            echo "- xcode: \`${{ inputs.xcode_version || '26.3' }}\`"
            echo "- status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
